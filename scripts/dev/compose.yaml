# Infrastructure for local development: `make dev-up` from the repository root.
# Not for running Penaria at home: the credentials here are fixed and public.
name: penaria-dev

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: penaria
      POSTGRES_PASSWORD: penaria
      POSTGRES_DB: penaria
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "penaria", "-d", "penaria"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SILO, the maintained community fork of MinIO (https://silo.pigsty.io); any S3 works.
  s3:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: penaria
      MINIO_ROOT_PASSWORD: penaria-dev
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3-bucket:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mcli alias set dev http://s3:9000 penaria penaria-dev && mcli mb --ignore-existing dev/penaria

volumes:
  postgres:
  s3:
