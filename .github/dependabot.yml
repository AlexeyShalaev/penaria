# One grouped pull request a week per ecosystem.
version: 2
updates:
  - package-ecosystem: uv
    directory: /services/server
    schedule: {interval: weekly, day: monday}
    groups:
      server:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/web
    schedule: {interval: weekly, day: monday}
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/services/server, /services/web]
    schedule: {interval: weekly, day: monday}
    ignore:
      # Node: LTS majors only, moved by hand together with node-version in ci.yml.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python minors move by hand together with .python-version, requires-python, ruff, mypy
      # and python-version in ci.yml.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]
