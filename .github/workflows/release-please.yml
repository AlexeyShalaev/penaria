name: Release Please

# release-please keeps a release pull request open with the next version. On every push to master
# the notes of that pull request are rebuilt from master's fragments in changes/, into
# release-notes.json and CHANGELOG.md. Merging it tags the release; the GitHub release then gets
# the curated notes, and the images are published.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write # to start publish.yml for the new tag

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pull requests and commits made with GITHUB_TOKEN start no workflow, so CI would never run on
      # the release pull request and its required check would never pass. A token of the release
      # App starts CI like a person's push. Without the App, GITHUB_TOKEN is used and the run warns.
      - name: Token from the release App
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: No release App
        if: steps.app.outcome == 'skipped'
        run: >-
          echo "::warning::RELEASE_APP_CLIENT_ID is not set: the release pull request is updated with
          GITHUB_TOKEN and CI does not run on it. Close and reopen it before merging."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ── A release pull request is open: rebuild its notes from master. ──────────────────────
      # release-please reports the pull request only when it changed it, and a commit that does not
      # release (docs, ci, chore) changes nothing for it, even when it edits or removes a fragment.
      # So the pull request is looked up, not taken from release-please's output.
      - name: Find the release pull request
        id: pending
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName --jq '.[0].headRefName // ""')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Check out the release pull request
        if: steps.pending.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token stays in the checkout on purpose: the next step pushes the notes to the release
        # pull request. No artifact is uploaded from this job.
        with:  # zizmor: ignore[artipacked]
          ref: ${{ steps.pending.outputs.branch }}
          # The whole history: master is merged into the branch below.
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.pending.outputs.branch != ''
        with:
          # No cache in a job that writes to the repository: a poisoned cache would reach the release.
          enable-cache: false

      - name: Rebuild the release notes
        if: steps.pending.outputs.branch != ''
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if [ -n "$APP_SLUG" ]; then
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          fi
          commit_if_changed() {
            git add -A
            git diff --cached --quiet || git commit --quiet -m "$1"
          }
          version=$(jq -r '.["."]' .release-please-manifest.json)

          # 1. Undo the notes an earlier run made: what the notes are built from is master's again,
          #    so merging master cannot conflict in it.
          rm -rf changes
          git checkout origin/master -- changes release-notes.json CHANGELOG.md services/server/uv.lock
          commit_if_changed "chore: take the release notes' sources from master"
          # 2. Catch up with master when release-please left the branch behind it.
          git merge --quiet --no-edit origin/master
          # 3. Collect master's fragments into this version's notes.
          python3 scripts/release/notes.py collect --version "$version" --date "$(date -u +%F)"
          # release-please bumped the version in pyproject.toml; uv.lock records it too.
          uv lock --project services/server
          commit_if_changed "chore: release notes for $version"

          # Steps 1 and 3 undo and redo the same notes when nothing changed on master.
          if git diff --quiet '@{upstream}' HEAD; then
            echo "The release notes are up to date."
          else
            git push
          fi

      # ── The release pull request was merged: publish. ───────────────────────────────────────
      - name: Check out the release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false

      - name: Release notes on the GitHub release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/release/notes.py render --version "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      # The release App's tag starts publish.yml by itself. A tag pushed with GITHUB_TOKEN starts no
      # workflow, but workflow_dispatch does.
      - name: Publish the images of the new tag
        if: steps.release.outputs.release_created == 'true' && steps.app.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
