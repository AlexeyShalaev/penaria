name: Release Please

# release-please keeps a release pull request open with the next version. Each time it opens or
# updates it, the fragments in changes/ are collected into release-notes.json and CHANGELOG.md in
# that pull request. Merging it tags the release; the GitHub release then gets the curated notes,
# and the images are published.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write # to start publish.yml for the new tag

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Pull requests and commits made with GITHUB_TOKEN start no workflow, so CI would never run on
      # the release pull request and its required check would never pass. A token of the release
      # App starts CI like a person's push. Without the App, GITHUB_TOKEN is used and the run warns.
      - name: Token from the release App
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write

      - name: No release App
        if: steps.app.outcome == 'skipped'
        run: >-
          echo "::warning::RELEASE_APP_CLIENT_ID is not set: the release pull request is updated with
          GITHUB_TOKEN and CI does not run on it. Close and reopen it before merging."

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ── The release pull request was opened or updated: collect the notes into it. ──────────
      - name: Check out the release pull request
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@v7
        if: steps.release.outputs.pr

      - name: Collect the release notes
        if: steps.release.outputs.pr
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '.["."]' .release-please-manifest.json)
          python3 scripts/release/notes.py collect --version "$version" --date "$(date -u +%F)"
          # release-please bumped the version in pyproject.toml; uv.lock records it too.
          uv lock --project services/server
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nothing to collect."
            exit 0
          fi
          if [ -n "$APP_SLUG" ]; then
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          fi
          git add -A
          git commit -m "chore: release notes for $version"
          git push

      # ── The release pull request was merged: publish. ───────────────────────────────────────
      - name: Check out the release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false

      - name: Release notes on the GitHub release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/release/notes.py render --version "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

      # A tag pushed with GITHUB_TOKEN starts no workflow, but workflow_dispatch does.
      - name: Publish the images of the new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
