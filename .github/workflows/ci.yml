name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Server · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    services:
      # The oldest PostgreSQL we support; development runs the newest (scripts/dev/compose.yaml).
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: penaria
          POSTGRES_PASSWORD: penaria
          POSTGRES_DB: penaria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U penaria -d penaria_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://penaria:penaria@localhost:5432/penaria_test
      TEST_S3_URL: http://penaria:penaria-dev@127.0.0.1:59000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # The interpreter of the image (services/server/Dockerfile).
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: services/server/uv.lock
      # The development stack's storage, pinned there; an Actions service cannot pass its command.
      - run: docker compose -f scripts/dev/compose.yaml up --detach --wait s3
        working-directory: .
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov --cov-report=term --cov-report=xml

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # The version comes from "packageManager" in package.json.
          package_json_file: services/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node of the image (services/web/Dockerfile).
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # The API client types match the server's OpenAPI document (services/server/openapi.json).
      - run: pnpm api:check
      - run: pnpm test:coverage
      # Built here too, so a broken build shows up on the pull request, not on the release tag.
      - run: pnpm build

  scripts:
    name: Scripts · lint, tests, release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx ruff check scripts
      - run: uvx ruff format --check scripts
      - run: uv run --no-project --with pytest pytest scripts -q
      # The fragments and release-notes.json are valid, CHANGELOG.md is generated from them.
      - run: python3 scripts/release/notes.py check

  workflows:
    name: Workflows · actionlint, zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Syntax, expressions and the shell in run: blocks (settings in .github/actionlint.yaml).
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      # Security of the workflows: unpinned actions, template injection, leaked credentials.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.33.1 --format github .github/workflows

  images:
    name: Images · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint hadolint --config /.hadolint.yaml - < services/${{ matrix.service }}/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: penaria-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Smoke
        run: |
          set -euo pipefail
          image="penaria-${{ matrix.service }}:ci"
          case "${{ matrix.service }}" in
            server)
              port=8000; path=/system/health/readyz
              # The server needs its database: migrate it with the image, then start the api.
              docker network create smoke
              docker run -d --name db --network smoke \
                -e POSTGRES_USER=penaria -e POSTGRES_PASSWORD=penaria -e POSTGRES_DB=penaria postgres:15-alpine
              until docker exec db pg_isready -U penaria -d penaria >/dev/null 2>&1; do sleep 1; done
              db_env=(-e PENARIA_DATABASE__CONNECTION__HOST=db -e PENARIA_DATABASE__CONNECTION__USER=penaria
                      -e PENARIA_DATABASE__CONNECTION__PASSWORD=penaria -e PENARIA_DATABASE__CONNECTION__DATABASE=penaria)
              docker run --rm --network smoke "${db_env[@]}" "$image" python -m penaria.apps.migrate upgrade
              docker run -d --name smoke --network smoke -p "$port:$port" "${db_env[@]}" \
                -e PENARIA_PUBLIC_URL="http://127.0.0.1:$port" -e PENARIA_SECRET_KEY=smoke-test-secret-key-of-32-characters "$image"
              ;;
            web)
              port=8080; path=/
              docker run -d --name smoke -p "$port:$port" "$image"
              ;;
          esac
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:$port$path" >/dev/null && { echo "up"; exit 0; }
            sleep 2
          done
          docker logs smoke
          exit 1

  # The home install as people run it: the Compose files of deploy/compose with images built
  # from this commit, first plain, then with the HTTPS overlay.
  install:
    name: Install · compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/compose/smoke-test.sh --https

  # The only required status check of the master ruleset; the list of jobs lives here.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [server, web, scripts, workflows, images, install]
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "Not passed: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed."
