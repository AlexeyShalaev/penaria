# Builds the images from this checkout instead of pulling released ones: for trying a
# change, and for the install test in CI. Use it together with compose.yaml:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  penaria-migrate:
    image: penaria-server:source
    build: ../../services/server
  penaria-server:
    image: penaria-server:source
    build: ../../services/server
  penaria-worker:
    image: penaria-server:source
    build: ../../services/server
  penaria-web:
    image: penaria-web:source
    build: ../../services/web
