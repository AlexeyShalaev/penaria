[project]
name = "penaria-server"
version = "0.0.0"
description = "Penaria server: the core and its processes (api, worker)"
readme = "README.md"
requires-python = ">=3.15"
license = "AGPL-3.0-only"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "authlib>=1.9.10",
    "cryptography>=50.0.2",
    "httpx2>=2.16.2",
    "joserfc>=1.8.0",
    "servicewright[dishka,fastapi,settings]>=0.15.0",
    "sqlalchemy-foundation-kit[dishka,settings]>=0.5.2",
    "webauthn>=3.0.1",
]

[project.scripts]
penaria-api = "penaria.apps.api.__main__:main"
penaria-migrate = "penaria.apps.migrate.__main__:main"
penaria-cli = "penaria.apps.cli.__main__:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "alembic-gauntlet>=0.3.1",
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penaria"]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "N", "S", "C4", "SIM", "TRY", "PERF", "RUF", "UP", "ANN", "T20", "PTH", "PLC", "PLE", "PLW"]
ignore = ["TRY003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["penaria"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true

# authlib ships no type information, and its stubs package trails its releases.
[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "unit: fast tests without external services",
    "integration: tests against the development stack (make dev-up), TEST_DATABASE_URL for PostgreSQL",
]

[tool.coverage.run]
source = ["penaria"]
branch = true

# The dependency rules between the packages, checked by `lint-imports` (make check).
[tool.importlinter]
root_package = "penaria"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "top-level"
name = "apps -> migrations -> modules | integrations -> features -> common"
type = "layers"
containers = ["penaria"]
layers = ["apps", "migrations", "modules | integrations", "features", "common"]

[[tool.importlinter.contracts]]
id = "apps-independent"
name = "apps do not import each other"
type = "independence"
modules = ["penaria.apps.*"]

# servicewright may also appear in the features: a domain error is a ServiceError and a route
# takes UnitScopeDep. The DI container is wired in the apps only.
[[tool.importlinter.contracts]]
id = "di-in-apps"
name = "dishka only in the apps"
type = "protected"
protected_modules = ["dishka"]
allowed_importers = ["penaria.apps"]
