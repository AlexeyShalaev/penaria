server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed assets never change: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
