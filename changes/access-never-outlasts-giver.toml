type = "security"
en = "Someone whose own access to a home ends can no longer give access that lasts longer: invitations, changes to people's access, guest links and password reset links stop at their own end."
ru = "Тот, чей доступ к дому ограничен по сроку, больше не может выдать доступ дольше своего: приглашения, изменения доступа, гостевые ссылки и ссылки для сброса пароля не выходят за его собственный срок."
