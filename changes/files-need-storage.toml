type = "upgrade"
en = "The Docker Compose install has two new containers for photos and documents, a file storage and a worker. Before you start the new version, add S3_PASSWORD to .env (openssl rand -hex 24 makes one), and from now on back up the files along with the database, as the install guide shows."
ru = "В установке Docker Compose появились два новых контейнера для фото и документов: хранилище файлов и обработчик. Перед запуском новой версии добавьте в .env переменную S3_PASSWORD (значение даст команда openssl rand -hex 24) и впредь копируйте вместе с базой и файлы, как показано в инструкции по установке."
