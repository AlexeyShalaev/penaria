type = "added"
en = "The web app shows your homes: create the first one, then build its tree of rooms, storage and things in the browser. Every place and thing has a page where you mark that it is in place, move, edit or archive it, and read its history."
ru = "В веб-приложении появились ваши дома: создайте первый и стройте в браузере дерево комнат, мест хранения и вещей. У каждого места и вещи есть своя страница: там можно отметить, что всё на месте, переместить, изменить, убрать в архив и посмотреть историю."
