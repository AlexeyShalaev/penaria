type = "added"
en = "Invite your family and others into a home with a link or a QR code, each with a role, a place and an end date; they make their account through the link, and one account can belong to many homes. Guests need no account: a guest link shows only what you marked for guests, ends on its own and can be revoked in one click. The People page shows who has access, lets you change or take it back, and hands the home over to a new owner."
ru = "Приглашайте семью и других людей в дом по ссылке или QR-коду — с ролью, местом и сроком; аккаунт они создают по этой же ссылке, и один аккаунт может состоять во многих домах. Гостям аккаунт не нужен: гостевая ссылка показывает только то, что вы отметили «для гостей», сама перестаёт работать в срок и отзывается одним нажатием. На странице «Люди и доступ» видно, у кого есть доступ, его можно изменить или забрать, а дом — передать новому владельцу."
