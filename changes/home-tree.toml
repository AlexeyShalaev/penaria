en = "Homes and their tree: create a home, then its properties, buildings, floors, rooms, containers and things; move, rename, archive, restore and confirm them, and see the history of each. Until sign-in arrives, every request acts as one local owner."
ru = "Дома и их дерево: создайте дом, затем участки, здания, этажи, помещения, контейнеры и вещи; перемещайте, переименовывайте, архивируйте, возвращайте и подтверждайте их и смотрите историю каждой. Пока нет входа в систему, все запросы выполняются от имени одного локального владельца."
