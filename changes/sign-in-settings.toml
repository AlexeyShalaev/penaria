type = "upgrade"
en = "Set two new variables for the server: PENARIA_PUBLIC_URL, the address you open Penaria at (such as https://home.example.org), and PENARIA_SECRET_KEY, a random secret of at least 32 characters (`openssl rand -hex 32`) that you keep. After the upgrade, read the setup token from the server's log (`docker compose logs penaria-server | grep \"setup token\"`) and enter it on the setup screen: your existing homes become your new account's."
ru = "Задайте серверу две новые переменные: PENARIA_PUBLIC_URL — адрес, по которому вы открываете Penaria (например, https://home.example.org), и PENARIA_SECRET_KEY — случайный секрет не короче 32 символов (`openssl rand -hex 32`), который нужно сохранить. После обновления возьмите токен настройки из журнала сервера (`docker compose logs penaria-server | grep \"setup token\"`) и введите его на экране настройки: ваши дома перейдут в новый аккаунт."
