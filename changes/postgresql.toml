type = "added"
en = "Penaria keeps its data in PostgreSQL 15 or newer, set with the PENARIA_DATABASE__* variables; `python -m penaria.apps.migrate upgrade` prepares the database before the server starts."
ru = "Penaria хранит данные в PostgreSQL 15 или новее, подключение задаётся переменными PENARIA_DATABASE__*; `python -m penaria.apps.migrate upgrade` готовит базу перед запуском сервера."
